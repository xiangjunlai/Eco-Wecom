<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Assist 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1263e6;--blue-dark:#0c55cd;--green:#13b96f;--orange:#f59e0b;--red:#ef4444;
  --bg:#f5f7fb;--panel:#fff;--border:#e8edf5;
  --text:#162033;--text2:#475467;--text3:#98a2b3;
  --radius:20px;--shadow:0 8px 32px rgba(20,34,64,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}

.header{background:var(--panel);border-bottom:1px solid var(--border);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(20,34,64,.04)}
.header-left{display:flex;align-items:center;gap:14px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:var(--blue)}
.header-title{font-weight:900;font-size:16px;color:var(--text)}
.header-sub{font-size:12px;color:var(--text3)}
.header-right{display:flex;align-items:center;gap:10px}
.btn-logout{border:1px solid var(--border);background:#fff;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;transition:.15s}
.btn-logout:hover{background:#f5f7fb}

.main{padding:28px 40px;max-width:1200px;margin:0 auto}

/* Stats cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--panel);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-card .stat-num{font-size:32px;font-weight:900;color:var(--blue);line-height:1}
.stat-card .stat-label{font-size:12px;color:var(--text3);margin-top:6px;font-weight:600}
.stat-card.green .stat-num{color:var(--green)}
.stat-card.orange .stat-num{color:var(--orange)}
.stat-card.red .stat-num{color:var(--red)}

/* Tabs */
.tabs{display:flex;gap:2px;margin-bottom:20px;background:#f0f4f8;padding:4px;border-radius:12px;width:fit-content;border:1px solid #e4e9f0}
.tab{padding:8px 20px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:.15s;border:0;background:transparent;font-family:inherit}
.tab.on{background:var(--panel);color:var(--blue);box-shadow:0 1px 4px rgba(18,99,230,.12)}
.tab:not(.on):hover{background:var(--panel);color:var(--blue)}

/* Table */
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{background:#f8fafc;padding:12px 16px;text-align:left;font-weight:700;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.table td{padding:12px 16px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:#f8fafc}
.table .empty{text-align:center;color:var(--text3);padding:40px}

/* Badges */
.badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-green{background:#ecfdf3;color:#059669}
.badge-gray{background:#f3f4f6;color:#6b7280}
.badge-blue{background:#e8f0ff;color:#1263e6}

/* Buttons */
.btn{ display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:#fff;transition:.15s;font-family:inherit }
.btn:hover{background:#f5f7fb}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-blue:hover{background:var(--blue-dark)}
.btn-danger{color:#dc2626;border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:4px 8px;font-size:11px}

/* Toolbar row */
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.toolbar-left{font-size:13px;font-weight:700;color:var(--text)}
.toolbar-right{display:flex;gap:8px;align-items:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:20px;width:440px;max-width:90vw;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.modal h3{font-size:18px;font-weight:900;margin-bottom:20px;color:var(--text)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:2px solid #e5e7eb;border-radius:10px;font-size:13px;font-family:inherit;outline:0;transition:.15s}
.form-group input:focus,.form-group select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,99,230,.1)}
.modal-actions{display:flex;gap:10px;margin-top:24px}
.modal-actions button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:0;font-family:inherit}
.modal-actions .btn-cancel{background:#f3f4f6;color:var(--text2)}
.modal-actions .btn-confirm{background:var(--blue);color:#fff}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999}

/* Action links */
.action-link{color:var(--blue);cursor:pointer;font-size:12px;font-weight:700;margin-right:8px}
.action-link:hover{text-decoration:underline}
.code-tag{font-family:monospace;background:#f0f4f8;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700;color:var(--text)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-icon"></div>
    <div>
      <div class="header-title">Provider Assist 管理后台</div>
      <div class="header-sub">服务商需求调研助手 · 数据管理中心</div>
    </div>
  </div>
  <div class="header-right">
    <span class="user-greet" id="user-greet"></span>
    <button class="btn-logout" onclick="logout()">退出登录</button>
  </div>
</div>

<div class="main">
  <!-- 统计数据 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="stat-users">-</div>
      <div class="stat-label">注册用户</div>
    </div>
    <div class="stat-card green">
      <div class="stat-num" id="stat-today">-</div>
      <div class="stat-label">今日新增</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-num" id="stat-clients">-</div>
      <div class="stat-label">客户项目总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-assigned">-</div>
      <div class="stat-label">已分配受邀码</div>
    </div>
    <div class="stat-card green">
      <div class="stat-num" id="stat-available">-</div>
      <div class="stat-label">可用受邀码</div>
    </div>
  </div>

  <!-- 标签页 -->
  <div class="tabs">
    <button class="tab on" data-tab="users" onclick="switchTab('users')">服务商用户</button>
    <button class="tab" data-tab="codes" onclick="switchTab('codes')">受邀码管理</button>
    <button class="tab" data-tab="clients" onclick="switchTab('clients')">客户列表</button>
  </div>

  <!-- Tab1: 服务商用户 -->
  <div id="tab-users">
    <div class="card">
      <div class="toolbar">
        <div class="toolbar-left">服务商用户列表</div>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th><th>服务商公司</th><th>用户名</th><th>注册时间</th><th>客户数</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="users-body"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Tab2: 受邀码管理 -->
  <div id="tab-codes" style="display:none">
    <div class="card">
      <div class="toolbar">
        <div class="toolbar-left">受邀码列表</div>
        <div class="toolbar-right">
          <button class="btn btn-blue" onclick="openCreateCodeModal()">+ 新增受邀码</button>
        </div>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>服务商公司</th><th>受邀码</th><th>状态</th><th>最大用户</th><th>已注册</th><th>关联用户</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="codes-body"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Tab3: 客户列表 -->
  <div id="tab-clients" style="display:none">
    <div class="card">
      <div class="toolbar">
        <div class="toolbar-left">所有客户列表</div>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>客户名称</th><th>服务商</th><th>行业</th><th>状态</th><th>创建时间</th>
          </tr>
        </thead>
        <tbody id="clients-body"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 创建受邀码弹窗 -->
<div class="modal-overlay" id="create-code-modal">
  <div class="modal">
    <h3>新增受邀码</h3>
    <div class="form-group">
      <label>服务商公司名称</label>
      <input type="text" id="code-provider" placeholder="请输入服务商公司名称">
    </div>
    <div class="form-group">
      <label>最大注册用户数</label>
      <input type="number" id="code-max-users" value="10" min="1" max="1000" placeholder="该企业最多注册多少个账号">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCreateCodeModal()">取消</button>
      <button class="btn-confirm" onclick="doCreateCode()">生成邀请码</button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://sining.cloud';
const TOKEN_KEY = 'provider-token';

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function getHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

async function api(url, opts = {}) {
  const resp = await fetch(API_BASE + url, {
    ...opts,
    headers: { ...getHeaders(), ...(opts.headers || {}) }
  });
  if (resp.status === 401 || resp.status === 403) { logout(); return null; }
  return resp.json();
}

function logout() {
  localStorage.removeItem('provider-token');
  localStorage.removeItem('provider-auto-login');
  window.location.href = 'login.html';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelector('.tab[data-tab="'+name+'"]').classList.add('on');
  ['users','codes','clients'].forEach(n => {
    document.getElementById('tab-' + n).style.display = n === name ? '' : 'none';
  });
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function loadStats() {
  var d = await api('/api/admin/stats');
  if (!d) return;
  document.getElementById('stat-users').textContent = d.total_users || 0;
  document.getElementById('stat-today').textContent = d.today_users || 0;
  document.getElementById('stat-clients').textContent = d.total_clients || 0;
  document.getElementById('stat-assigned').textContent = d.assigned_codes || 0;
  document.getElementById('stat-available').textContent = d.available_codes || 0;
}

async function loadUsers() {
  var users = await api('/api/admin/users');
  var tbody = document.getElementById('users-body');
  if (!users) { tbody.innerHTML = '<tr><td colspan="6" class="empty">加载失败</td></tr>'; return; }
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>'; return; }
  tbody.innerHTML = users.map(u => '<tr>' +
    '<td>' + u.id + '</td>' +
    '<td>' + esc(u.provider_name) + '</td>' +
    '<td>' + esc(u.username) + '</td>' +
    '<td>' + (u.created_at ? u.created_at.substring(0,10) : '-') + '</td>' +
    '<td>' + u.client_count + '个</td>' +
    '<td><span class="action-link" onclick="viewUserClients(' + u.id + ')">查看客户</span><span class="action-link" onclick="deleteUser(' + u.id + ')">删除</span></td>' +
    '</tr>').join('');
}

async function loadCodes() {
  var codes = await api('/api/admin/invitation-codes');
  var tbody = document.getElementById('codes-body');
  if (!codes) { tbody.innerHTML = '<tr><td colspan="7" class="empty">加载失败</td></tr>'; return; }
  if (!codes.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>'; return; }
  tbody.innerHTML = codes.map(c => {
    var isFull = c.used >= c.max_users;
    return '<tr>' +
      '<td>' + esc(c.provider_name) + '</td>' +
      '<td><span class="code-tag">' + esc(c.code) + '</span></td>' +
      '<td><span class="badge ' + (isFull ? 'badge-gray' : 'badge-green') + '">' + (isFull ? '已满' : '可用') + '</span></td>' +
      '<td>' + c.max_users + '人</td>' +
      '<td>' + c.used + '人</td>' +
      '<td>' + (c.used_by_username !== '-' ? '<span class="badge badge-blue">' + esc(c.used_by_username) + '</span>' : '-') + '</td>' +
      '<td><span class="action-link" onclick="resetCode(' + c.id + ')">重置码</span><span class="action-link" onclick="deleteCode(' + c.id + ')">删除</span></td>' +
      '</tr>';
  }).join('');
}

async function loadClients() {
  var clients = await api('/api/admin/clients');
  var tbody = document.getElementById('clients-body');
  if (!clients) { tbody.innerHTML = '<tr><td colspan="5" class="empty">加载失败</td></tr>'; return; }
  if (!clients.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无数据</td></tr>'; return; }
  tbody.innerHTML = clients.map(c => '<tr>' +
    '<td>' + esc(c.name) + '</td>' +
    '<td>' + esc(c.provider_name) + '</td>' +
    '<td>' + esc(c.industry || '-') + '</td>' +
    '<td><span class="badge ' + (c.status === '已完成' ? 'badge-green' : 'badge-gray') + '">' + esc(c.status || '待完善') + '</span></td>' +
    '<td>' + (c.created_at ? c.created_at.substring(0,10) : '-') + '</td>' +
    '</tr>').join('');
}

function openCreateCodeModal() {
  document.getElementById('code-provider').value = '';
  document.getElementById('code-max-users').value = '10';
  document.getElementById('create-code-modal').classList.add('active');
}

function closeCreateCodeModal() {
  document.getElementById('create-code-modal').classList.remove('active');
}

async function doCreateCode() {
  var provider = document.getElementById('code-provider').value.trim();
  var maxUsers = parseInt(document.getElementById('code-max-users').value) || 10;
  if (!provider) { showToast('请输入服务商公司名称'); return; }
  var d = await api('/api/admin/invitation-codes', {
    method: 'POST',
    body: JSON.stringify({ provider_name: provider, max_users: maxUsers })
  });
  if (!d) return;
  showToast('邀请码 ' + d.code + ' 生成成功');
  closeCreateCodeModal();
  loadCodes();
  loadStats();
}

async function resetCode(id) {
  if (!confirm('确定要重置此受邀码吗？将生成新码')) return;
  var d = await api('/api/admin/invitation-codes/' + id + '/reset', { method: 'POST' });
  if (!d) return;
  showToast('新码：' + d.code);
  loadCodes();
}

async function deleteCode(id) {
  if (!confirm('确定删除此受邀码？')) return;
  await api('/api/admin/invitation-codes/' + id, { method: 'DELETE' });
  showToast('已删除');
  loadCodes();
  loadStats();
}

async function deleteUser(id) {
  if (!confirm('确定删除此用户？其客户数据将一并删除')) return;
  await api('/api/admin/users/' + id, { method: 'DELETE' });
  showToast('已删除');
  loadUsers();
  loadStats();
}

function viewUserClients(userId) {
  window.open('client_list.html?user_id=' + userId, '_blank');
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function init() {
  if (!getToken()) { logout(); return; }
  await loadStats();
  await loadUsers();
}

// Tab switcher: also reload data
var _currentTab = 'users';
function switchTab(name) {
  _currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelector('.tab[data-tab="'+name+'"]').classList.add('on');
  ['users','codes','clients'].forEach(n => {
    document.getElementById('tab-' + n).style.display = n === name ? '' : 'none';
  });
  if (name === 'users') loadUsers();
  else if (name === 'codes') loadCodes();
  else if (name === 'clients') loadClients();
}

init();
</script>
</body>
</html>
