<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Assist 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1263e6;--blue-light:#3b82f6;--green:#13b96f;--orange:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --bg:#0f1117;--sidebar-bg:#161b27;--panel:#1e2433;--panel2:#252d3d;--border:#2d3548;
  --text:#e8edf5;--text2:#94a3b8;--text3:#64748b;
  --radius:16px;--shadow:0 8px 32px rgba(0,0,0,.3);
  --stat-gradient-blue:linear-gradient(135deg,#1263e6,#3b82f6);--stat-gradient-green:linear-gradient(135deg,#13b96f,#34d399);--stat-gradient-orange:linear-gradient(135deg,#f59e0b,#fbbf24);--stat-gradient-red:linear-gradient(135deg,#ef4444,#f87171);--stat-gradient-purple:linear-gradient(135deg,#8b5cf6,#a78bfa);
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}

/* ===== Layout ===== */
.layout{display:flex;height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sidebar-logo-icon{width:36px;height:36px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo-text{font-weight:900;font-size:15px;color:var(--text);line-height:1.2}
.sidebar-logo-sub{font-size:10px;color:var(--text3);font-weight:500}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav-item .nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .nav-badge{background:rgba(255,255,255,.2);border-radius:999px;padding:1px 7px;font-size:10px;margin-left:auto}
.nav-footer{padding:12px 10px;border-top:1px solid var(--border)}
.user-info{padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-role{font-size:10px;color:var(--text3)}
.logout-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:6px;transition:.15s;font-family:inherit}
.logout-btn:hover{background:var(--panel);color:var(--text)}

/* ===== Main content ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-top{background:var(--panel);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.main-top-title{font-size:15px;font-weight:800;color:var(--text)}
.main-top-sub{font-size:11px;color:var(--text3);margin-top:2px}
.main-body{flex:1;overflow-y:auto;padding:24px 28px}

/* ===== Stat cards ===== */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--panel);border-radius:var(--radius);padding:20px 24px;border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.blue::before{background:var(--stat-gradient-blue)}
.stat-card.green::before{background:var(--stat-gradient-green)}
.stat-card.orange::before{background:var(--stat-gradient-orange)}
.stat-card.red::before{background:var(--stat-gradient-red)}
.stat-card.purple::before{background:var(--stat-gradient-purple)}
.stat-card .stat-icon{font-size:24px;margin-bottom:12px}
.stat-card .stat-num{font-size:28px;font-weight:900;line-height:1;margin-bottom:4px}
.stat-card.blue .stat-num{color:#60a5fa}
.stat-card.green .stat-num{color:#34d399}
.stat-card.orange .stat-num{color:#fbbf24}
.stat-card.red .stat-num{color:#f87171}
.stat-card.purple .stat-num{color:#a78bfa}
.stat-card .stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-card .stat-change{font-size:11px;margin-top:8px;font-weight:700}
.stat-card .stat-change.up{color:#34d399}
.stat-card .stat-change.down{color:#f87171}

/* ===== Section ===== */
.section{background:var(--panel);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.section-title{font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.section-title .section-icon{font-size:16px}
.section-toolbar{display:flex;gap:8px;align-items:center}
.section-body{padding:0}

/* ===== Table ===== */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{background:#161b27;padding:11px 16px;text-align:left;font-weight:700;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 16px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:rgba(255,255,255,.03)}
.table .empty{text-align:center;color:var(--text3);padding:40px}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-green{background:rgba(19,185,111,.15);color:#34d399}
.badge-gray{background:rgba(100,116,139,.15);color:#94a3b8}
.badge-blue{background:rgba(18,99,230,.15);color:#60a5fa}
.badge-orange{background:rgba(245,158,11,.15);color:#fbbf24}
.badge-red{background:rgba(239,68,68,.15);color:#f87171}
.badge-purple{background:rgba(139,92,246,.15);color:#a78bfa}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);transition:.15s;font-family:inherit}
.btn:hover{background:var(--border)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-blue:hover{background:var(--blue-light)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{color:#f87171;border-color:rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(239,68,68,.1)}
.btn-sm{padding:4px 8px;font-size:11px}
.btn svg{width:14px;height:14px;flex-shrink:0}

/* ===== Toolbar ===== */
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.toolbar-left{font-size:13px;font-weight:700;color:var(--text)}
.toolbar-right{display:flex;gap:8px;align-items:center}
.search-box{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;gap:6px}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:12px;font-family:inherit;width:180px}
.search-box input::placeholder{color:var(--text3)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--panel);border-radius:20px;width:900px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:900;color:var(--text)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;border-radius:6px;transition:.15s;line-height:1}
.modal-close:hover{background:var(--border);color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ===== Step content view ===== */
.step-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--panel2);padding:4px;border-radius:10px;width:fit-content}
.step-tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;transition:.15s;border:none;background:none;font-family:inherit}
.step-tab.active{background:var(--blue);color:#fff}
.step-tab:hover:not(.active){color:var(--text)}
.step-content-area{background:var(--panel2);border-radius:12px;border:1px solid var(--border);padding:20px;min-height:200px}
.step-summary{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.step-full{font-size:13px;color:var(--text2);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.step-edit-area{width:100%;min-height:160px;background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:12px;font-size:13px;color:var(--text);font-family:inherit;resize:vertical;outline:none;transition:.15s}
.step-edit-area:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,99,230,.15)}
.step-notes{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:12px 16px;margin-top:16px}
.step-notes-label{font-size:11px;font-weight:700;color:#fbbf24;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.step-notes textarea{width:100%;background:none;border:none;outline:none;color:var(--text);font-size:12px;font-family:inherit;resize:vertical;min-height:60px;line-height:1.6}
.step-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}

/* ===== Funnel ===== */
.funnel{display:flex;align-items:center;gap:8px;margin:16px 0}
.funnel-step{display:flex;flex-direction:column;align-items:center;flex:1}
.funnel-bar{height:40px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;transition:.3s;min-width:60px}
.funnel-bar:hover{opacity:.85}
.funnel-label{font-size:10px;color:var(--text3);margin-top:6px;text-align:center;font-weight:600}
.funnel-rate{font-size:10px;color:var(--text3);margin-top:2px}

/* ===== Charts (CSS only) ===== */
.bar-chart{margin-top:16px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{font-size:12px;color:var(--text2);width:80px;flex-shrink:0;font-weight:600}
.bar-track{flex:1;height:24px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;color:#fff;transition:width .6s ease}
.bar-value{font-size:12px;color:var(--text3);width:50px;text-align:right;flex-shrink:0}

/* ===== Admin login ===== */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;align-items:center;justify-content:center}
.login-screen.hidden{display:none}
.login-box{background:var(--panel);border-radius:24px;border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.4);padding:40px;width:400px;max-width:90vw}
.login-box h2{font-size:22px;font-weight:900;margin-bottom:6px;color:var(--text)}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:28px}
.login-box .form-group{margin-bottom:18px}
.login-box .form-group label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.login-box .form-group input{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:0;transition:.15s;background:var(--panel2);color:var(--text)}
.login-box .form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,99,230,.15)}
.login-box .btn-submit{width:100%;padding:13px;border-radius:10px;background:var(--blue);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.login-box .btn-submit:hover{background:var(--blue-light);transform:translateY(-1px)}
.login-box .btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-box .error-msg{color:#f87171;font-size:12px;margin-top:10px;padding:8px 12px;background:rgba(248,113,113,.1);border-radius:6px;display:none}
.login-box .error-msg.show{display:block}

/* ===== Client detail expandable panel ===== */
.expand-panel{background:var(--panel2);border-radius:10px;border:1px solid var(--border);margin:8px 0;overflow:hidden}
.expand-head{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:12px;transition:.15s}
.expand-head:hover{background:rgba(255,255,255,.03)}
.expand-head .expand-arrow{font-size:12px;color:var(--text3);transition:.2s;flex-shrink:0}
.expand-panel.open .expand-arrow{transform:rotate(90deg)}
.expand-info{flex:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.expand-body{padding:0 16px 16px;display:none}
.expand-panel.open .expand-body{display:block}

/* ===== Toast ===== */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--panel2);color:var(--text);padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.3)}

/* ===== Utility ===== */
.hidden{display:none!important}
.text-muted{color:var(--text3)}
.text-green{color:#34d399}
.text-red{color:#f87171}
.text-orange{color:#fbbf24}
.text-blue{color:#60a5fa}
.fw-bold{font-weight:700}
</style>
</head>
<body>

<!-- Admin Login -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h2>管理后台登录</h2>
    <p>输入管理员账号信息</p>
    <div id="login-error" class="error-msg"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn-submit" id="login-btn" onclick="doLogin()">登录</button>
  </div>
</div>

<!-- Layout -->
<div class="layout" id="layout" style="display:none">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📊</div>
      <div>
        <div class="sidebar-logo-text">Provider Assist</div>
        <div class="sidebar-logo-sub">管理后台</div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-item active" data-tab="overview" onclick="switchTab('overview')">
        <span class="nav-icon">📈</span>概览仪表盘
      </div>
      <div class="nav-item" data-tab="providers" onclick="switchTab('providers')">
        <span class="nav-icon">🏢</span>服务商管理
        <span class="nav-badge" id="nav-provider-count">0</span>
      </div>
      <div class="nav-item" data-tab="clients" onclick="switchTab('clients')">
        <span class="nav-icon">👥</span>客户总览
        <span class="nav-badge" id="nav-client-count">0</span>
      </div>
      <div class="nav-item" data-tab="ai" onclick="switchTab('ai')">
        <span class="nav-icon">🤖</span>AI 统计
        <span class="nav-badge" id="nav-ai-badge">配额</span>
      </div>
      <div class="nav-item" data-tab="knowledge" onclick="switchTab('knowledge')">
        <span class="nav-icon">📚</span>知识库
      </div>
      <div class="nav-item" data-tab="codes" onclick="switchTab('codes')">
        <span class="nav-icon">🎫</span>受邀码管理
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role">管理员</div>
        </div>
        <button class="logout-btn" onclick="logout()">退出</button>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-top">
      <div>
        <div class="main-top-title" id="top-title">概览仪表盘</div>
        <div class="main-top-sub" id="top-sub">平台数据总览</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="text-muted" style="font-size:12px" id="top-time"></span>
      </div>
    </div>

    <div class="main-body" id="main-body">
      <!-- Tab content rendered here -->
    </div>
  </div>
</div>

<!-- Modal: Client Detail -->
<div class="modal-overlay" id="client-detail-modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-client-title">客户详情</div>
      <button class="modal-close" onclick="closeClientModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-client-body"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeClientModal()">关闭</button>
    </div>
  </div>
</div>

<!-- Modal: Provider Detail -->
<div class="modal-overlay" id="provider-detail-modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-provider-title">服务商详情</div>
      <button class="modal-close" onclick="closeProviderModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-provider-body"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeProviderModal()">关闭</button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://sining.cloud';
const TOKEN_KEY = 'admin-token';

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function getHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

async function api(url, opts = {}) {
  try {
    const resp = await fetch(API_BASE + url, {
      ...opts,
      headers: { ...getHeaders(), ...(opts.headers || {}) }
    });
    if (resp.status === 401 || resp.status === 403) { logout(); return null; }
    if (opts.returnBlob) {
      if (!resp.ok) {
        const text = await resp.text();
        try {
          const json = JSON.parse(text);
          throw new Error(json.detail || ('HTTP ' + resp.status));
        } catch(e) {
          if (e.message.startsWith('HTTP')) throw new Error(e.message);
          throw new Error(text.substring(0, 200));
        }
      }
      const cd = resp.headers.get('Content-Disposition') || '';
      const match = cd.match(/filename\*?=['"]?(?:UTF-8'')?([^;\n"']+)/i);
      const filename = match ? decodeURIComponent(match[1]) : 'download';
      const blob = await resp.blob();
      return { blob, filename };
    }
    const text = await resp.text();
    try { return JSON.parse(text); } catch { return text; }
  } catch(e) { return null; }
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function formatDate(s) {
  if (!s) return '-';
  return s.substring(0, 10);
}

function timeAgo(s) {
  if (!s) return '-';
  const d = new Date(s);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  if (diff < 604800) return Math.floor(diff/86400) + '天前';
  return formatDate(s);
}

// ===== Login =====
async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errorEl.classList.remove('show');
  if (!username || !password) { errorEl.textContent = '请输入用户名和密码'; errorEl.classList.add('show'); return; }
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const resp = await fetch(API_BASE + '/api/test-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (data.access_token) {
      localStorage.setItem(TOKEN_KEY, data.access_token);
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('layout').style.display = 'flex';
      document.getElementById('user-name').textContent = data.user?.username || username;
      document.getElementById('user-avatar').textContent = (username || 'A').charAt(0).toUpperCase();
      switchTab('overview');
    } else {
      errorEl.textContent = data.detail || '登录失败';
      errorEl.classList.add('show');
    }
  } catch(e) {
    errorEl.textContent = '网络错误，请稍后重试';
    errorEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('layout').style.display = 'none';
}

// ===== Tab Navigation =====
var _currentTab = 'overview';

function switchTab(name) {
  _currentTab = name;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('.nav-item[data-tab="'+name+'"]').classList.add('active');
  const titles = {
    overview: ['概览仪表盘', '平台数据总览'],
    providers: ['服务商管理', '服务商账号与分级'],
    clients: ['客户总览', '所有客户项目一览'],
    content: ['内容查看', '所有 Step 内容查阅'],
    ai: ['AI 统计', 'Token 消耗与配额管理'],
    codes: ['受邀码管理', '注册码生成与分配'],
    knowledge: ['知识库', '各服务商知识库文件汇总']
  };
  document.getElementById('top-title').textContent = titles[name]?.[0] || name;
  document.getElementById('top-sub').textContent = titles[name]?.[1] || '';

  var body = document.getElementById('main-body');
  if (name === 'overview') renderOverview();
  else if (name === 'providers') renderProviders();
  else if (name === 'clients') renderClients();
  else if (name === 'ai') renderAI();
  else if (name === 'codes') renderCodes();
  else if (name === 'knowledge') renderKnowledge();
}

  window._allCodes = codes;
  window._providerMap = {};
  providers.forEach(p => { window._providerMap[p.id] = p; });

  drawProviderTable(providers);

  // Load step completion for each provider
  providers.forEach(async (p, i) => {
    var clients = await api('/api/admin/clients?user_id=' + p.id);
    if (Array.isArray(clients)) {

function drawProviderTable(providers) {
  var codes = window._allCodes || [];
  var tbody = document.getElementById('providers-tbody');
  if (!providers.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无服务商</td></tr>';
    return;
  }
  tbody.innerHTML = providers.map(p => {
    var codeInfo = codes.find(c => c.provider_name === p.provider_name);
    var codeStatus = codeInfo ? (codeInfo.used >= codeInfo.max_users ? 'badge-gray' : 'badge-green') : 'badge-gray';
    var codeLabel = codeInfo ? (codeInfo.used >= codeInfo.max_users ? '已满' : '可用') : '无码';
    var grade = p.grade || '普通';
    var gradeClass = grade === '优质' ? 'badge-green' : grade === '试用' ? 'badge-orange' : 'badge-gray';
    return '<tr data-id="'+p.id+'">' +
      '<td><span class="fw-bold">' + esc(p.provider_name) + '</span></td>' +
      '<td>' + esc(p.username) + '</td>' +
      '<td class="text-muted">' + formatDate(p.created_at) + '</td>' +
      '<td><span class="badge badge-blue">' + (p.client_count || 0) + ' 个</span></td>' +
      '<td><span class="badge ' + codeStatus + '">' + codeLabel + '</span></td>' +
      '<td><span class="badge ' + gradeClass + '" id="grade-'+p.id+'" onclick="openGradeModal('+p.id+',\''+esc(grade)+'\')" style="cursor:pointer" title="点击修改分级">' + grade + '</span></td>' +
      '<td>' +
        '<button class="btn btn-sm" onclick="viewProvider(' + p.id + ')">查看详情</button> ' +
        '<button class="btn btn-sm btn-danger" onclick="deleteProvider(' + p.id + ')">删除</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function filterProviders(q) {
  q = q.toLowerCase();
  var filtered = window._allProviders.filter(p =>
    (p.provider_name || '').toLowerCase().includes(q) ||
    (p.username || '').toLowerCase().includes(q)

  drawProviderTable(filtered);
}

function hasContent(val) {
  if (!val) return false;
  if (typeof val === 'string') return val.trim().length > 0;
  if (typeof val === 'object') return true;
  return false;
}

async function renderClients() {

function drawClientsList(clients) {
  var container = document.getElementById('clients-list');

    container.innerHTML = '<div class="empty" style="padding:40px">暂无客户数据</div>';
    return;
  }

    var uName = userInfo?.username || '-';
    var statusBadge = c.is_completed || c._completed ? 'badge-green' : 'badge-gray';
    var statusText = c.is_completed || c._completed ? '已完成' : '待完善';

    var step1ok = hasContent(c.step1_result) ? '✅' : '❌';
    var s1 = typeof c.step1_result === 'string' ? (function(){ try { return JSON.parse(c.step1_result); } catch(e){ return null; } })() : (c.step1_result || null);
    var step2ok = (s1 && (s1.part3 || s1.part2 || s1.must_ask)) ? '✅' : '❌';
    var step3ok = hasContent(c.step3_summary) || hasContent(c.uploaded_files) ? '✅' : '❌';
    var step4ok = hasContent(c.step4_presales_versions) || hasContent(c.step4_technical_versions) ? '✅' : '❌';

            <span class="text-muted" style="font-size:11px;white-space:nowrap">🏭${esc(c.industry || '-')}</span>
            <span style="font-size:11px;white-space:nowrap">
              <span title="Step1" style="color:${step1ok==='✅'?'#13b96f':'#ef4444'}">S1${step1ok}</span>
              <span title="Step2" style="color:${step2ok==='✅'?'#13b96f':'#ef4444'}">S2${step2ok}</span>
              <span title="Step3" style="color:${step3ok==='✅'?'#13b96f':'#ef4444'}">S3${step3ok}</span>
              <span title="Step4" style="color:${step4ok==='✅'?'#13b96f':'#ef4444'}">S4${step4ok}</span>
              <span title="Step5" style="color:${step5ok==='✅'?'#13b96f':'#ef4444'}">S5${step5ok}</span>
            </span>

          <span class="text-muted" style="font-size:11px;white-space:nowrap;flex-shrink:0">${formatDate(c.created_at)}</span>
          <span class="text-muted" style="font-size:11px;white-space:nowrap;flex-shrink:0;margin-right:8px">更新:${formatDate(c.updated_at)}</span>

          ${renderClientRowContent(c, {pName, uName})}

    `;

function renderClientRowContent(c, userInfo) {
  var pName = userInfo?.pName || '-';
  var uName = userInfo?.uName || '-';

  function jparse(val) {
    if (!val) return null;
    if (typeof val === 'object') return val;
    try { return JSON.parse(val); } catch(e) { return null; }
  }

  var s1 = jparse(c.step1_result);
  var step3Sum = jparse(c.step3_summary);
  var step5Schema = jparse(c.step5_schema);
  var step5Suggestions = jparse(c.step5_agent_suggestions);
  var step4Draft = jparse(c.step4_input_draft);
  var uploadedFiles = jparse(c.uploaded_files) || [];
  var s4Versions = jparse(c.step4_presales_versions) || [];
  var s4Latest = Array.isArray(s4Versions) && s4Versions.length > 0 ? s4Versions[s4Versions.length - 1] : null;

  // 辅助：渲染 kv 列表
  function kvRow(label, value) {
    if (!value || (typeof value === 'string' && !value.trim())) return '';
    return '<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #2d3548;align-items:flex-start"><span style="color:#94a3b8;font-size:11px;min-width:90px;flex-shrink:0;font-weight:600">'+esc(label)+'</span><span style="color:#e8edf5;font-size:12px;flex:1;word-break:break-all;line-height:1.5">'+esc(String(value).substring(0,300))+'</span></div>';
  }

  // 辅助：渲染数组项列表
  function listRow(items, labelFn) {
    if (!items || !items.length) return '<span style="color:#3d4a5c;font-size:12px">暂无</span>';
    return items.map(function(item, i) {
      var text = typeof item === 'string' ? item : (labelFn ? labelFn(item, i) : (item.text || item.title || item.gap || item.question || JSON.stringify(item)));
      if (!text) return '';
      return '<div style="padding:6px 0;border-bottom:1px solid #2d3548;display:flex;gap:8px;align-items:flex-start">' +
        '<span style="color:#60a5fa;font-size:11px;min-width:20px;flex-shrink:0">'+(i+1)+'.</span>' +
        '<span style="color:#e8edf5;font-size:12px;flex:1;word-break:break-all;line-height:1.5">'+esc(text)+'</span></div>';
    }).join('');
  }

  // 渲染文件下载行
  function fileRow(f) {
    var fname = f.name || f.file_name || '文件';
    var ftext = f.text || f.content || '';
    var fsize = f.size || '';
    return '<div style="background:#252d3d;border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid #2d3548">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
        '<span style="font-size:13px">📄</span>' +
        '<span style="color:#e8edf5;font-size:12px;font-weight:600;flex:1">'+esc(fname)+'</span>' +
        (fsize ? '<span style="color:#64748b;font-size:11px">'+esc(fsize)+'</span>' : '') +
      '</div>' +
      (ftext ? '<div style="color:#94a3b8;font-size:11px;line-height:1.5;margin-top:4px;white-space:pre-wrap;word-break:break-all">'+esc(ftext.substring(0,200))+(ftext.length>200?'…':'')+'</div>' : '') +
      '<div style="margin-top:6px"><a href="javascript:void(0)" onclick="downloadFile(\''+esc(fname)+'\',\''+esc(f.text||f.content||'').replace(/'/g,"\\'")+'\')" style="color:#60a5fa;font-size:11px;text-decoration:none;font-weight:600">⬇ 下载原始文件</a></div>'+
    '</div>';
  }

  // Step1 内容
  var step1Rows = '';
  step1Rows += kvRow('客户名称', c.name);
  step1Rows += kvRow('行业', c.industry);
  step1Rows += kvRow('规模', c.scale);
  step1Rows += kvRow('标签', c.tags);
  step1Rows += kvRow('初始需求', c.initial_demand);
  var hasStep1 = !!step1Rows;

  // Step2 内容：从 s1 提取调研问题
  var allQuestions = [];
  if (s1 && typeof s1 === 'object') {
    var arr = function(v){ return Array.isArray(v) ? v : []; };
    var part2 = arr(s1.part2 || s1.gaps);
    var part3 = s1.part3 || {};
    var mustAsk = arr(part3.must_ask || part3.must || part3.mandatory);
    var deepDive = arr(part3.deep_dive || part3.deep || part3.followup);
    var industryExp = arr(part3.industry_experience || part3.industry);
    allQuestions = allQuestions.concat(part2.map(function(q){ return {type:'待确认', text: q.gap || q.text || q.question || q.item || ''}; }));
    allQuestions = allQuestions.concat(mustAsk.map(function(q){ return {type:'必问', text: q.question || q.text || ''}; }));
    allQuestions = allQuestions.concat(deepDive.map(function(q){ return {type:'深入追问', text: q.question || q.text || ''}; }));
    allQuestions = allQuestions.concat(industryExp.map(function(q){ return {type:'行业经验', text: q.question || q.text || ''}; }));
  }
  var step2Content = '';
  if (allQuestions.length) {
    step2Content = '<div style="display:flex;flex-direction:column;gap:4px">';
    allQuestions.forEach(function(q, i) {
      if (!q.text) return;
      var typeColor = {待确认:'#fbbf24',必问:'#f87171',深入追问:'#a78bfa',行业经验:'#34d399'}[q.type] || '#94a3b8';
      step2Content += '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #2d3548;align-items:flex-start">' +
        '<span style="background:'+typeColor+';color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;flex-shrink:0;font-weight:700;min-width:52px;text-align:center">'+esc(q.type)+'</span>' +
        '<span style="color:#e8edf5;font-size:12px;flex:1;line-height:1.5">'+(i+1)+'. '+esc(q.text)+'</span></div>';
    });
    step2Content += '</div>';
  }
  var hasStep2 = !!step2Content;

  // Step3 内容
  var step3Content = '';
  if (uploadedFiles.length) {
    step3Content += '<div style="margin-bottom:16px"><div style="color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">📎 已上传文件（'+uploadedFiles.length+'个）</div>';
    uploadedFiles.forEach(function(f) { step3Content += fileRow(f); });
    step3Content += '</div>';
  }
  // step3Sum._raw 是 JSON 字符串，包含完整结构化内容
  var step3AiSummaryRaw = step3Sum ? (step3Sum._raw || step3Sum.summary || (typeof step3Sum === 'string' ? step3Sum : '')) : '';
  if (step3AiSummaryRaw) {
    var summaryObj = null;
    try { summaryObj = JSON.parse(step3AiSummaryRaw); } catch(e) {}
    var summaryHtml = '';
    if (summaryObj && typeof summaryObj === 'object') {
      var labelMap = {
        customerCurrentState:'客户现状', painPoints:'核心问题(痛点)', confirmedNeeds:'已确认需求',
        involvedRoles:'涉及角色', currentProcess:'当前流程', expectedOutcome:'期望效果',
        phaseOneScope:'一期范围', phaseTwoScope:'二期评估', pendingQuestions:'待确认问题'
      };
      for (var k in summaryObj) {
        var v = summaryObj[k];
        if (!v || (typeof v === 'string' && !v.trim())) continue;
        var label = labelMap[k] || k;
        if (Array.isArray(v)) {
          var items = v.map(function(item) {
            if (typeof item === 'object') {
              return (item.title || item.item || '') + (item.description ? '：' + item.description : '');
            }
            return String(item);
          }).filter(Boolean);
          if (items.length) summaryHtml += kvRow(label, items.join('；'));
        } else if (typeof v === 'object') {
          var text = (v.title || v.item || '') + (v.description ? '：' + v.description : '');
          if (text) summaryHtml += kvRow(label, text);
        } else {
          summaryHtml += kvRow(label, String(v));
        }
      }
    }
    if (summaryHtml) {
      step3Content += '<div><div style="color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">🤖 AI 摘要</div>' +
        '<div style="background:#252d3d;border-radius:8px;padding:12px;border:1px solid #2d3548;color:#e8edf5;font-size:12px;line-height:1.7">'+summaryHtml+'</div></div>';
    }
  }
  var hasStep3 = !!step3Content;

  // Step4 内容：9字段 + HTML/Word链接
  var step4Content = '';
  var draftFields = [
    ['customerCurrentState','客户现状'],['painPoints','核心问题'],['confirmedNeeds','已确认需求'],
    ['involvedRoles','涉及角色'],['currentProcess','当前流程'],['expectedOutcome','期望效果'],
    ['phaseOneScope','一期范围'],['phaseTwoScope','二期评估'],['pendingQuestions','待确认问题']
  ];
  if (step4Draft) {
    draftFields.forEach(function(f) {
      var key = f[0], label = f[1];
      var val = step4Draft[key];
      if (!val) return;
      if (typeof val === 'object') val = val.map(function(v){ return v.item || v.title || v.text || v || ''; }).filter(Boolean).join('、');
      step4Content += kvRow(label, val);
    });
  }
  // 售前产物链接
  var s4HtmlUrl = s4Latest && s4Latest.file_url || '';
  var s4WordUrl = s4Latest && s4Latest.filename || '';
  if (s4HtmlUrl || s4WordUrl) {
    step4Content += '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">';
    if (s4HtmlUrl) step4Content += '<a href="'+esc(s4HtmlUrl)+'" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#1263e6;color:#fff;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none">🌐 售前HTML</a>';
    if (s4WordUrl) step4Content += '<a href="javascript:void(0)" onclick="downloadWord(\''+esc(s4WordUrl)+'\')" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#13b96f;color:#fff;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none">📄 Word方案</a>';
    step4Content += '</div>';
  }
  var hasStep4 = !!step4Content;

  // Step5 内容
  var step5Content = '';
  if (step5Schema) {
    var sheets = step5Schema.sheets || [];
    if (sheets.length) {
      step5Content += '<div style="margin-bottom:12px"><div style="color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">📊 智能表格结构</div>';
      sheets.forEach(function(s) {
        var fields = s.fields || [];
        var fieldNames = fields.map(function(f){ return f.field_title || f.name || ''; }).filter(Boolean);
        step5Content += '<div style="background:#252d3d;border-radius:8px;padding:10px 12px;margin-bottom:6px;border:1px solid #2d3548">' +
          '<div style="color:#60a5fa;font-size:12px;font-weight:700;margin-bottom:4px">'+esc(s.sheet_name || s.name || '子表')+'</div>' +
          '<div style="color:#94a3b8;font-size:11px">字段：'+esc(fieldNames.join('、'))+'</div></div>';
      });
      step5Content += '</div>';
    }
  }
  if (step5Suggestions && step5Suggestions.length) {
    step5Content += '<div><div style="color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">💡 Agent 建议（'+step5Suggestions.length+'条）</div>';
    step5Suggestions.slice(0,5).forEach(function(s, i) {
      step5Content += '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #2d3548;align-items:flex-start">' +
        '<span style="color:#60a5fa;font-size:11px;min-width:20px;flex-shrink:0">'+(i+1)+'.</span>' +
        '<div><div style="color:#e8edf5;font-size:12px;font-weight:600">'+esc(s.title || '')+'</div>' +
        (s.description ? '<div style="color:#94a3b8;font-size:11px;margin-top:2px">'+esc(s.description)+'</div>' : '') +
        '</div></div>';
    });
    step5Content += '</div>';
  }
  var hasStep5 = !!step5Content;

  // 使用 API 的 hasStepX 标志（列表 API 返回的快速判断）
  var apiHasStep1 = c.hasStep1 || !!step1Rows;
  var apiHasStep2 = c.hasStep2 || !!step2Content;
  var apiHasStep3 = c.hasStep3 || !!step3Content;
  var apiHasStep4 = c.hasStep4 || !!step4Content;
  var apiHasStep5 = c.hasStep5 || !!step5Content;

  // 当 content 为空但 API 标志为有数据时，显示"点击查看详情"
  function contentOrHint(content, hasData) {
    if (content) return content;
    if (hasData) return '<span style="color:#3d4a5c;font-size:12px">点击上方「查看内容」按钮获取详情</span>';
    return '<span style="color:#3d4a5c;font-size:12px">暂无数据</span>';
  }

  function stepCard(icon, label, content, hasData) {
    var borderColor = hasData ? '#1263e6' : '#2d3548';
    var headerBg = hasData ? 'rgba(18,99,230,.15)' : '#1e2433';
    var headerColor = hasData ? '#60a5fa' : '#64748b';
    return '<div style="background:#1e2433;border-radius:12px;border:1px solid '+borderColor+';overflow:hidden;margin-bottom:12px">' +
      '<div style="padding:10px 16px;background:'+headerBg+';border-bottom:1px solid #2d3548;display:flex;align-items:center;gap:10px">' +
        '<span style="font-size:14px;font-weight:700;color:'+headerColor+'">'+icon+' '+label+'</span>' +
        (hasData ? '<span style="font-size:10px;background:rgba(19,185,111,.2);color:#34d399;padding:2px 8px;border-radius:999px;font-weight:700">有数据</span>' : '<span style="font-size:10px;background:#2d3548;color:#64748b;padding:2px 8px;border-radius:999px;font-weight:700">待完善</span>') +
      '</div>' +
      '<div style="padding:14px 16px">' +
        contentOrHint(content, hasData) +
      '</div>' +
    '</div>';
  }

  return '<div style="padding:4px 0 16px">' +
    '<div style="font-size:11px;color:#3d4a5c;margin-bottom:14px;border-bottom:1px solid #2d3548;padding-bottom:10px">' +
      '服务商：<b style="color:#64748b">'+esc(pName)+'</b>　账号：<b style="color:#64748b">'+esc(uName)+'</b>　创建：<b style="color:#3d4a5c">'+formatDate(c.created_at)+'</b>　更新：<b style="color:#3d4a5c">'+formatDate(c.updated_at)+'</b>' +
    '</div>' +
    stepCard('📋','Step1 客户背景', step1Rows, apiHasStep1) +
    stepCard('❓','Step2 调研准备', step2Content, apiHasStep2) +
    stepCard('📝','Step3 沟通纪要', step3Content, apiHasStep3) +
    stepCard('📄','Step4 售前方案', step4Content, apiHasStep4) +
    stepCard('🎨','Step5 Demo生成', step5Content, apiHasStep5) +
  '</div>';
}

function downloadFile(name, content) {
  if (!content) { alert('文件内容为空，无法下载'); return; }
  var blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function downloadWord(filename) {
  var blob = new Blob([filename], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function toggleClientPanel(id) {
  var panel = document.getElementById('client-panel-' + id);
  if (!panel) return;
  panel.classList.toggle('open');
}

function filterClients() {
  var q = (document.getElementById('client-search')?.value || '').toLowerCase();
  var status = document.getElementById('client-status-filter')?.value || '';
  var stepFilter = document.getElementById('client-step-filter')?.value || '';

  var filtered = window._allClients.filter(c => {
    var userInfo = window._userMap ? window._userMap[c.user_id] : null;
    var pName = (userInfo?.provider_name || c.provider_name || '').toLowerCase();
    var uName = (userInfo?.username || '').toLowerCase();
    var matchQ = !q || (c.name||'').toLowerCase().includes(q) || pName.includes(q) || uName.includes(q) || (c.industry||'').toLowerCase().includes(q);
    var matchStatus = !status || (status === 'completed' && (c.is_completed || c._completed)) || (status === 'pending' && !c.is_completed && !c._completed);
    var matchStep = !stepFilter || (function(){
      if (stepFilter === 'step1') return hasContent(c.step1_result);
      if (stepFilter === 'step2') { var s1 = (typeof c.step1_result === 'string' ? JSON.parse(c.step1_result) : c.step1_result); return s1 && (s1.part3 || s1.part2 || s1.must_ask); }
      if (stepFilter === 'step3') return hasContent(c.step3_summary) || hasContent(c.uploaded_files);
      if (stepFilter === 'step4') return hasContent(c.step4_presales_versions) || hasContent(c.step4_technical_versions);
      if (stepFilter === 'step5') return hasContent(c.step5_schema);
      return true;
    })();
    return matchQ && matchStatus && matchStep;
  });
  drawClientsList(filtered);
}

function exportAllClients() {
  var data = JSON.stringify(window._allClients || [], null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'clients-export-' + new Date().toISOString().substring(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功');
}

function getClientById(id) {
  return window._clientMap ? window._clientMap[id] : null;
}

async function openClientModal(id) {
  var loading = document.getElementById('modal-client-body');
  if (loading) loading.innerHTML = '<div style="text-align:center;padding:60px;color:#64748b;font-size:14px">加载中…</div>';
  document.getElementById('client-detail-modal').classList.add('active');
  try {
    var c = await api('/api/admin/clients/' + id);
    if (c.error) { showToast(c.error); return; }
    renderClientDetailModal(c);
  } catch(e) {
    showToast('获取客户详情失败');
  }
}

function closeClientModal() {
  document.getElementById('client-detail-modal').classList.remove('active');
}

function renderClientDetailModal(c) {
  document.getElementById('modal-client-title').textContent = c.name + ' - 内容详情';
  var body = document.getElementById('modal-client-body');

  var steps = [
    { key: 'step1', label: 'Step 1', title: '客户背景', icon: '📋' },
    { key: 'step2', label: 'Step 2', title: '调研问题清单', icon: '❓' },
    { key: 'step3', label: 'Step 3', title: '方案输入确认单', icon: '✅' },
    { key: 'step4', label: 'Step 4', title: '售前解决方案', icon: '📄' },
    { key: 'step5', label: 'Step 5', title: 'Demo + Agent 建议', icon: '🎨' }
  ];

  body.innerHTML = `
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="badge ${c.is_completed || c._completed ? 'badge-green' : 'badge-gray'}">${c.is_completed || c._completed ? '已完成' : '待完善'}</span>
      <span class="text-muted" style="font-size:12px">服务商：${esc(c.provider_name)}</span>
      <span class="text-muted" style="font-size:12px">行业：${esc(c.industry || '-')}</span>
      <span class="text-muted" style="font-size:12px">创建：${formatDate(c.created_at)}</span>
    </div>
    <div class="step-tabs" id="step-tabs">
      ${steps.map((s, i) => '<button class="step-tab' + (i === 0 ? ' active' : '') + '" data-step="'+s.key+'" onclick="switchStepTab(\''+s.key+'\')">' + s.icon + ' ' + s.title + '</button>').join('')}
    </div>
    <div id="step-detail-container">
      <div class="step-content-area" id="step-detail-area">加载中…</div>
    </div>
  `;

  // Store client data for step tab switching
  window._currentDetailClient = c;

function switchStepTab(stepKey) {
  document.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.step-tab[data-step="'+stepKey+'"]').classList.add('active');

  var c = window._currentDetailClient;
  var area = document.getElementById('step-detail-area');
  if (!c || !area) return;

  function jparse(val) {
    if (!val) return null;
    if (typeof val === 'object') return val;
    try { return JSON.parse(val); } catch(e) { return null; }
  }

  function kvRow(label, value) {
    if (!value || (typeof value === 'string' && !value.trim())) return '';
    return '<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #2d3548;align-items:flex-start"><span style="color:#94a3b8;font-size:12px;min-width:100px;flex-shrink:0;font-weight:600">'+esc(label)+'</span><span style="color:#e8edf5;font-size:13px;flex:1;word-break:break-all;line-height:1.5">'+esc(String(value).substring(0,400))+'</span></div>';
  }

  function renderStep3(c) {
    // Step3: AI摘要（_raw结构化）+ 已上传文件
    var s3 = jparse(c.step3_summary);
    var uploadedFiles = jparse(c.uploaded_files) || [];
    var html = '';
    if (uploadedFiles.length) {
      html += '<div style="margin-bottom:16px"><div style="color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">📎 已上传文件（'+uploadedFiles.length+'个）</div>';
      uploadedFiles.forEach(function(f) {
        var fname = f.name || f.file_name || '文件';
        var ftext = f.text || f.content || '';
        html += '<div style="background:#252d3d;border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid #2d3548">' +
          '<div style="color:#e8edf5;font-size:12px;font-weight:600;margin-bottom:4px">📄 '+esc(fname)+'</div>' +
          (ftext ? '<div style="color:#94a3b8;font-size:11px;line-height:1.5;white-space:pre-wrap">'+esc(ftext.substring(0,200))+'</div>' : '') +
          '</div>';
      });
      html += '</div>';
    }
    var raw = s3 ? (s3._raw || '') : '';
    if (raw) {
      var obj = null;
      try { obj = JSON.parse(raw); } catch(e) {}
      if (obj && typeof obj === 'object') {
        var labelMap = {
          customerCurrentState:'客户现状',painPoints:'核心问题(痛点)',confirmedNeeds:'已确认需求',
          involvedRoles:'涉及角色',currentProcess:'当前流程',expectedOutcome:'期望效果',
          phaseOneScope:'一期范围',phaseTwoScope:'二期评估',pendingQuestions:'待确认问题'
        };
        var summaryHtml = '';
        for (var k in obj) {
          var v = obj[k];
          if (!v || (typeof v === 'string' && !v.trim())) continue;
          var label = labelMap[k] || k;
          if (Array.isArray(v)) {
            var items = v.map(function(item) {
              if (typeof item === 'object') return (item.title || item.item || '') + (item.description ? '：' + item.description : '');
              return String(item);
            }).filter(Boolean);
            if (items.length) summaryHtml += kvRow(label, items.join('；'));
          } else if (typeof v === 'object') {
            var text = (v.title || v.item || '') + (v.description ? '：' + v.description : '');
            if (text) summaryHtml += kvRow(label, text);
          } else {
            summaryHtml += kvRow(label, String(v));
          }
        }
        if (summaryHtml) {
          html += '<div><div style="color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">🤖 AI 摘要</div>' +
            '<div style="background:#252d3d;border-radius:8px;padding:12px;border:1px solid #2d3548;line-height:1.7">'+summaryHtml+'</div></div>';
        }
      }
    }
    return html || '<span style="color:#3d4a5c;font-size:13px">暂无内容</span>';
  }

  function renderStep5(c) {
    var s5 = jparse(c.step5_schema);
    var suggestions = jparse(c.step5_agent_suggestions) || [];
    var html = '';

    return;
  }
  if (stepKey === 'step5') {
    area.innerHTML = renderStep5(c) +
      '<div class="step-notes" style="margin-top:16px"><div class="step-notes-label">🔒 内部备注</div>' +
      '<textarea style="width:100%;background:#1e2433;border:1px solid #2d3548;border-radius:8px;padding:10px;color:#e8edf5;font-size:12px;min-height:80px;font-family:inherit;outline:none" id="note-step5" onchange="saveNote('+c.id+',\'step5\',this.value)">'+esc(c.admin_note_step5||'')+'</textarea></div>';
    return;
  }
  if (stepKey === 'step4') {
    function getStep4Content(field) {
      var raw = c[field];
      if (!raw) return '';
      try {
        var arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (Array.isArray(arr) && arr.length > 0) {
          var latest = arr[arr.length - 1];
          var content = latest.content || latest;
          return typeof content === 'object' ? JSON.stringify(content, null, 2) : content;
        }
        if (typeof arr === 'object') {
          return arr.content || JSON.stringify(arr, null, 2);
        }
        return typeof arr === 'string' ? arr : JSON.stringify(arr, null, 2);
      } catch(e) {
        return typeof raw === 'string' ? raw : JSON.stringify(raw, null, 2);
      }
    }
    var presales = getStep4Content('step4_presales_versions');
    var technical = getStep4Content('step4_technical_versions');
    area.innerHTML = `
      <div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">📄 售前解决方案</div>

      </div>

        ${technical ? '<div class="step-full">'+esc(technical)+'</div>' : '<div style="color:#3d4a5c;font-size:13px">暂无内容</div>'}
      </div>
      <div class="step-notes"><div class="step-notes-label">🔒 内部备注</div>
        <textarea style="width:100%;background:#1e2433;border:1px solid #2d3548;border-radius:8px;padding:10px;color:#e8edf5;font-size:12px;min-height:80px;font-family:inherit;outline:none" id="note-step4" onchange="saveNote(${c.id},'step4',this.value)">${esc(c.admin_note_step4||'')}</textarea>
      </div>
    `;
    return;
  }

  var raw = c[fieldMap[stepKey]] || '';
  function fmt(val) {
    if (!val) return '';
    try {
      var obj = typeof val === 'string' ? JSON.parse(val) : val;
      return JSON.stringify(obj, null, 2);
    } catch(e) { return typeof val === 'string' ? val : JSON.stringify(val, null, 2); }
  }
  var hasContent = raw && raw.trim().length > 0;
  area.innerHTML = `
    ${hasContent ? '<div class="step-full" id="view-' + stepKey + '" style="white-space:pre-wrap;max-height:600px;overflow-y:auto;font-size:13px;line-height:1.6;margin-bottom:12px">'+esc(fmt(raw))+'</div>' : '<div style="color:#3d4a5c;font-size:13px;margin-bottom:12px">暂无内容</div>'}
    <div class="step-notes"><div class="step-notes-label">🔒 内部备注</div>
      <textarea style="width:100%;background:#1e2433;border:1px solid #2d3548;border-radius:8px;padding:10px;color:#e8edf5;font-size:12px;min-height:80px;font-family:inherit;outline:none" id="note-step${stepKey}" onchange="saveNote(${c.id},'${stepKey}',this.value)">${esc(c['admin_note_' + stepKey]||'')}</textarea>
    </div>
  `;
}

function enableStepEdit(key) {
  var viewEl = document.getElementById('view-' + key);
  var editEl = document.getElementById('edit-' + key);
  var saveEl = document.getElementById('save-actions-' + key);
  if (viewEl) viewEl.style.display = 'none';
  if (editEl) { editEl.style.display = 'block'; editEl.focus(); }
  if (saveEl) saveEl.style.display = 'flex';
}

function cancelStepEdit(key) {
  var viewEl = document.getElementById('view-' + key);
  var editEl = document.getElementById('edit-' + key);
  var saveEl = document.getElementById('save-actions-' + key);
  if (viewEl) viewEl.style.display = '';
  if (editEl) editEl.style.display = 'none';
  if (saveEl) saveEl.style.display = 'none';
}

async function saveStepEdit(clientId, field, key) {
  var content = document.getElementById('edit-' + key)?.value || '';
  var d = await api('/api/clients/' + clientId, {
    method: 'PUT',
    body: JSON.stringify({ [field]: content })
  });
  if (d) {
    showToast('保存成功');
    // Update local cache
    if (window._clientMap && window._clientMap[clientId]) {
      window._clientMap[clientId][field] = content;
    }
    if (window._currentDetailClient) {
      window._currentDetailClient[field] = content;
    }
  } else {
    showToast('保存失败');
  }
}

async function saveNote(clientId, step, value) {
  var field = 'admin_note_' + step;
  await api('/api/clients/' + clientId, {
    method: 'PUT',
    body: JSON.stringify({ [field]: value })
  });
  if (window._clientMap && window._clientMap[clientId]) {
    window._clientMap[clientId][field] = value;
  }
  showToast('备注已保存');
}

          '<span onclick="toggleKnowledgeGroup(\''+esc(pname)+'\')" style="cursor:pointer;font-size:12px;color:var(--text3);width:16px">'+(_knowledgeExpanded[pname] ? '▼' : '▶')+'</span>' +
          '<span style="font-size:15px;font-weight:800;color:var(--text)">🏢 '+esc(pname)+'</span>' +
          '<span style="background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px">'+gfiltered.length+' 个文件</span>' +
          '<span style="color:var(--text3);font-size:12px;margin-left:auto">'+gfiltered.length+'个文件 · '+(gtotalChars>1000?Math.round(gtotalChars/1000)+'k':gtotalChars)+' 字</span>' +
          '<button onclick="downloadProviderKb(\''+esc(pname)+'\')" style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:var(--green);color:#fff;border-radius:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;margin-left:8px">📦 一键下载(zip)</button>' +
        '</div>' +
        '<div id="kb-group-'+esc(pname)+'" style="display:'+(isOpen?'block':'none')+';padding:0"></div>';
    });
  }
  html += '</div>';
  body.innerHTML = html;

  // Load group content if opened
  if (!showGroups) {
    Object.keys(_knowledgeExpanded).forEach(function(pname) {
      if (_knowledgeExpanded[pname] && !document.getElementById('kb-group-'+pname).innerHTML) {
        loadKnowledgeGroupContent(pname);
      }
    });
  }
}

async function downloadKbFile(fileId, filename) {
  try {
    var result = await api('/api/admin/kb/files/'+fileId+'/download', {returnBlob:true});
    if (!result || !result.blob) {
      alert('下载失败：服务器未返回有效文件');
      return;
    }
    // Check if blob is a JSON error (sanity check)
    if (result.blob.type === 'application/json' || result.blob.type === 'text/plain') {
      var text = await result.blob.text();
      try {
        var json = JSON.parse(text);
        alert('下载失败：' + (json.detail || JSON.stringify(json)));
      } catch {
        alert('下载失败：' + text.substring(0, 100));
      }
      return;
    }
    var url = URL.createObjectURL(result.blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename || result.filename || 'download';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) { alert('下载失败: '+e.message); }
}

async function previewKbFile(fileId) {
  var m = document.getElementById('kb-preview-modal') || createKbPreviewModal();
  m.querySelector('.modal-body').innerHTML = '<div style="color:var(--text3);text-align:center;padding:40px">加载中…</div>';
  m.style.display = 'flex';
  try {
    var data = await api('/api/admin/kb/files/'+fileId+'/content');
    if (data && data.content !== undefined) {
      m.querySelector('.modal-body').innerHTML = '<pre style="white-space:pre-wrap;word-break:break-all;font-size:13px;line-height:1.6;color:var(--text)">'+esc(data.content)+'</pre>';
    } else {
      m.querySelector('.modal-body').innerHTML = '<div style="color:var(--text3);text-align:center;padding:40px">'+esc(data.detail||'无法预览')+'</div>';
    }
  } catch(e) {
    m.querySelector('.modal-body').innerHTML = '<div style="color:var(--red);text-align:center;padding:40px">加载失败: '+esc(e.message)+'</div>';
  }
}

function renameKbFile(fileId, currentName) {
  var newName = prompt('请输入新的文件名：', currentName);
  if (!newName || newName === currentName) return;
  api('/api/admin/kb/files/'+fileId, {
    method: 'PATCH',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: 'display_name='+encodeURIComponent(newName)
  }).then(function(data) {
    if (data && data.success) {
      showToast('重命名成功');
      renderKnowledge();
    } else {
      alert('重命名失败: ' + (data&&data.detail||'未知错误'));
    }
  });
}

function deleteKbFile(fileId) {
  if (!confirm('确定要删除这个知识库文件吗？此操作不可恢复。')) return;
  api('/api/admin/kb/files/'+fileId, {method:'DELETE'}).then(function(data) {
    if (data && data.success) {
      showToast('删除成功');
      renderKnowledge();
    } else {
      alert('删除失败: ' + (data&&data.detail||'未知错误'));
    }
  });
}

function createKbPreviewModal() {
  var m = document.createElement('div');
  m.id = 'kb-preview-modal';
  m.style = 'display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center';
  m.innerHTML = '<div style="background:var(--panel);border-radius:var(--radius);border:1px solid var(--border);width:800px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden">' +
    '<div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--panel2)">' +
      '<span style="font-weight:800;font-size:14px;color:var(--text)">📄 文件预览</span>' +
      '<button onclick="this.closest(\'#kb-preview-modal\').style.display=\'none\'" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;line-height:1">✕</button>' +
    '</div>' +
    '<div class="modal-body" style="flex:1;overflow-y:auto;padding:20px"></div>' +
  '</div>';
  document.body.appendChild(m);
  return m;
}

async function downloadProviderKb(pname) {
  var btn = event.currentTarget;
  btn.disabled = true;
  btn.textContent = '打包中…';
  try {
    var data = await api('/api/admin/kb/providers/' + encodeURIComponent(pname) + '/download-all', {returnBlob:true});
    if (data && data.blob) {
      var url = URL.createObjectURL(data.blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = data.filename || (pname + '_知识库文件.zip');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  } catch(e) {
    alert('下载失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '📦 一键下载(zip)';
  }
}

async function renderCodes() {
  var body = document.getElementById('main-body');
  body.innerHTML = '<div style="text-align:center;color:var(--text3);padding:80px">加载中…</div>';
  var codes = await api('/api/admin/invitation-codes');
  if (!Array.isArray(codes)) codes = [];

  body.innerHTML = `
    <div class="section">
      <div class="toolbar">
        <div class="toolbar-left">受邀码列表（共 ${codes.length} 个）</div>
        <div class="toolbar-right">
          <button class="btn btn-blue" onclick="openCreateCodeModal()">+ 新增受邀码</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>服务商公司</th><th>受邀码</th><th>状态</th><th>最大用户</th><th>已注册</th><th>已注册用户</th><th>创建时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="codes-tbody"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  window._allCodes = codes;
  drawCodesTable(codes);
}

function drawCodesTable(codes) {
  var tbody = document.getElementById('codes-tbody');
  if (!codes.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无受邀码</td></tr>';
    return;
  }
  tbody.innerHTML = codes.map(c => {
    var regCount = c.registered_count || 0;
    var isFull = regCount >= c.max_users;
    return '<tr>' +
      '<td><span class="fw-bold">' + esc(c.provider_name) + '</span></td>' +
      '<td><span style="font-family:monospace;background:var(--panel2);padding:3px 10px;border-radius:6px;font-weight:700;font-size:13px">' + esc(c.code) + '</span></td>' +
      '<td><span class="badge ' + (isFull ? 'badge-gray' : 'badge-green') + '">' + (isFull ? '已满' : '可用') + '</span></td>' +
      '<td>' + c.max_users + '人</td>' +
      '<td><span class="text-orange">' + regCount + '</span> / ' + c.max_users + '</td>' +
      '<td>' + (function(){
          var names = (c.registered_users || '').split(',').filter(Boolean);
          if (!names.length) return '<span class="text-muted">-</span>';
          return names.map(function(n){ return '<span style="display:inline-block;background:var(--panel2);color:var(--text);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin:2px">'+esc(n)+'</span>'; }).join('');
        })() + '</td>' +
      '<td class="text-muted">' + formatDate(c.created_at) + '</td>' +
      '<td>' +
        '<button class="btn btn-sm" onclick="copyCode(\'' + esc(c.code) + '\')">复制</button> ' +
        '<button class="btn btn-sm" onclick="resetCode(' + c.id + ')">重置</button> ' +
        '<button class="btn btn-sm btn-danger" onclick="deleteCode(' + c.id + ')">删除</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function copyCode(code) {
  navigator.clipboard?.writeText(code).then(() => showToast('已复制: ' + code)).catch(() => {
    var ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('已复制: ' + code);
  });
}

function openCreateCodeModal() {
  document.getElementById('code-provider').value = '';
  document.getElementById('code-max-users').value = '10';
  document.getElementById('create-code-modal').classList.add('active');
}

function closeCreateCodeModal() {
  document.getElementById('create-code-modal').classList.remove('active');
}

async function doCreateCode() {
  var provider = document.getElementById('code-provider').value.trim();
  var maxUsers = parseInt(document.getElementById('code-max-users').value) || 10;
  if (!provider) { showToast('请输入服务商公司名称'); return; }
  var d = await api('/api/admin/invitation-codes', {
    method: 'POST',
    body: JSON.stringify({ provider_name: provider, max_users: maxUsers })
  });
  if (d && d.code) {
    showToast('邀请码 ' + d.code + ' 生成成功');
    closeCreateCodeModal();
    renderCodes();
    refreshStats();
  } else {
    showToast('生成失败: ' + (d?.detail || '未知错误'));
  }
}

async function resetCode(id) {
  if (!confirm('确定要重置此受邀码？将生成新码，旧码立即失效')) return;
  var d = await api('/api/admin/invitation-codes/' + id + '/reset', { method: 'POST' });
  if (d && d.code) {
    showToast('新码：' + d.code);
    renderCodes();
  } else {
    showToast('重置失败');
  }
}

async function deleteCode(id) {
  if (!confirm('确定删除此受邀码？')) return;
  var r = await api('/api/admin/invitation-codes/' + id, { method: 'DELETE' });
  showToast('已删除');
  renderCodes();
  refreshStats();
}

// ===== Stats refresh helper =====
async function refreshStats() {
  var d = await api('/api/admin/stats');
  if (!d) return;
  document.getElementById('stat-users').textContent = d.total_users || 0;
  document.getElementById('stat-today').textContent = d.today_users || 0;
}

// ===== Init =====
async function init() {
  if (!getToken()) {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('layout').style.display = 'none';
    return;
  }
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('layout').style.display = 'flex';
  switchTab('overview');
}

init();

var GRADES = ['普通', '试用', '优质'];
var _gradeTarget = null;

function openGradeModal(userId, currentGrade) {
  _gradeTarget = userId;
  var select = document.getElementById('grade-select');
  select.innerHTML = GRADES.map(g =>
    '<option value="'+g+'"' + (g === currentGrade ? ' selected' : '') + '>'+g+'</option>'
  ).join('');
  document.getElementById('grade-modal').classList.add('active');
}

function closeGradeModal() {
  document.getElementById('grade-modal').classList.remove('active');
  _gradeTarget = null;
}

async function doUpdateGrade() {
  if (!_gradeTarget) return;
  var grade = document.getElementById('grade-select').value;
  var d = await api('/api/admin/users/' + _gradeTarget, {
    method: 'PUT',
    body: JSON.stringify({ grade })
  });
  if (d && d.success) {
    showToast('分级已更新为：' + grade);
    // Update local cache and UI
    if (window._providerMap && window._providerMap[_gradeTarget]) {
      window._providerMap[_gradeTarget].grade = grade;
    }
    // Update grade badge
    var badge = document.getElementById('grade-' + _gradeTarget);
    if (badge) {
      badge.textContent = grade;
      badge.className = 'badge ' + (grade === '优质' ? 'badge-green' : grade === '试用' ? 'badge-orange' : 'badge-gray');
      badge.onclick = function() { openGradeModal(_gradeTarget, grade); };
    }
    closeGradeModal();
  } else {
    showToast('更新失败');
  }
}
</script>
