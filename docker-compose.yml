version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-63d4e005ecb646b08538368c5172ed82}
    restart: unless-stopped

